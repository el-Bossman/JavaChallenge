```html
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Java Code Lab</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/codemirror@5.65.19/lib/codemirror.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/codemirror@5.65.19/theme/dracula.css"
    />
  </head>
  <body>
    <div class="app">
      <!-- =================================================
             SIDEBAR
        ================================================== -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>Java Code Lab</h1>
          <p>Aprende Java paso a paso</p>
        </div>
        <!-- PROGRESS -->
        <div class="progress-container">
          <div>
            <span>Progreso</span>
            <span id="progress-text">0%</span>
          </div>
          <div class="progress-bar">
            <div id="progress-fill"></div>
          </div>
        </div>
        <!-- CHALLENGES -->
        <nav class="challenge-list">
          <div id="challenge-list"></div>
        </nav>
        <!-- FOOTER -->
        <div class="sidebar-footer">Java Code Lab</div>
      </aside>
      <!-- =================================================
             MAIN CONTENT
        ================================================== -->
      <main class="main-content">
        <!-- TOPBAR -->
        <header class="topbar">
          <div class="topbar-left">
            <span id="challenge-number"> Desafío 1</span>
            <h1 id="challenge-title">Cargando...</h1>
          </div>
          <button id="reset-button" type="button">↻ Restaurar</button>
        </header>
        <!-- =================================================
                 CHALLENGE CONTENT
            ================================================== -->
        <section class="challenge-content">
          <!-- INSTRUCTIONS -->
          <section class="instructions">
            <h2>Enunciado</h2>
            <div id="challenge-description">Cargando desafío...</div>
            <!-- HINT -->
            <div class="hint-container">
              <button id="hint-button" type="button">💡 Mostrar pista</button>
              <div id="hint-content" hidden></div>
            </div>
          </section>
          <!-- =================================================
                     LAB
                ================================================== -->
          <section class="lab">
            <!-- EDITOR -->
            <div class="editor-panel">
              <textarea
                id="code-editor"
                spellcheck="false"
                aria-label="Editor de código Java"
              ></textarea>
              <button id="run-button" type="button">▶ Evaluar código</button>
            </div>
            <!-- OUTPUT -->
            <div class="output-panel">
              <div id="output">
                <div class="output-placeholder">
                  <span>🖥️</span>
                  <p>
                    Evalúa tu código para comprobar si la solución es correcta.
                  </p>
                </div>
              </div>
            </div>
          </section>
          <!-- =================================================
                     NAVIGATION
                ================================================== -->
          <nav class="navigation">
            <button id="previous-button" type="button">← Anterior</button>
            <span id="navigation-progress"> 1 / 1</span>
            <button id="next-button" type="button">Siguiente →</button>
          </nav>
        </section>
      </main>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.19/lib/codemirror.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.19/mode/clike/clike.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
